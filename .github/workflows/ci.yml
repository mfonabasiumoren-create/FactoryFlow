
name: FactoryFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test FactoryFlow API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt PyYAML

      - name: Compile Python files
        run: python -m py_compile app/app.py tests/test_app.py

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t factoryflow-api:${{ github.sha }} .
