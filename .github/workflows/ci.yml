
name: FactoryFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test FactoryFlow API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: factoryflow
          POSTGRES_USER: factoryflow_user
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoryflow_user -d factoryflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt PyYAML

      - name: Compile Python files
        run: python -m py_compile app/app.py tests/test_app.py

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t factoryflow-api:${{ github.sha }} .
     
      - name: Verify Docker health check
        run: |
          docker image inspect factoryflow-api:${{ github.sha }} \
            --format '{{if .Config.Healthcheck}}Health check configured{{else}}Health check missing{{end}}' \
            | grep -q "Health check configured"

      - name: Run API container
        run: |
          docker run -d \
            --name factoryflow-api-test \
            --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=factoryflow \
            -e DB_USER=factoryflow_user \
            -e POSTGRES_PASSWORD=ci-only-placeholder \
            factoryflow-api:${{ github.sha }}

      - name: Verify API runtime health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health \
              --output health.json; then
              break
            fi
            sleep 2
          done

          python -c "import json; d=json.load(open('health.json')); assert d['status'] == 'healthy' and d['database'] == 'connected', d"

